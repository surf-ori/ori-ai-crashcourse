[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's full rule catalog is noisy for short teaching notebooks and
# includes rules (bandit, pylint-refactor, bugbear) that were never part
# of its historical "just lint my code" default -- among them PLR1711,
# which flags the `return` marimo generates at the end of every cell
# function (even trivial ones) as "useless". That's the notebook format,
# not a mistake. Scope to pycodestyle errors + pyflakes, the combination
# most people mean by "ruff check".
select = ["E4", "E7", "E9", "F"]
